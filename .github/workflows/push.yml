name: Branch and Pull Request CI

on:
  push:
    branches-ignore:
      # These branches already invoke the reusable CI from their release workflows.
      - main
      - alpha
      - beta
      - rc
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
